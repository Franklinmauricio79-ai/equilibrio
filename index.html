<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Equilibrio · Bienestar integral</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5FA382">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Equilibrio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#F4EEE2; --surface:#FCFAF4; --surface2:#F7F2E7;
    --ink:#2C2A24; --muted:#8C8576; --line:#E6DECE;
    --mente:#6C7BD1; --cuerpo:#D9794E; --emo:#E0A92E; --familia:#C4577A; --salud:#5FA382;
    --shadow:0 1px 2px rgba(44,42,36,.04),0 8px 24px rgba(44,42,36,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 100% -5%, rgba(108,123,209,.10), transparent 60%),
      radial-gradient(800px 500px at -10% 110%, rgba(95,163,130,.12), transparent 60%),
      var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
  header.top{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 18px}
  .brand{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;letter-spacing:-.01em}
  .brand span{color:var(--salud)}
  .today{font-size:13px;color:var(--muted);font-weight:500;text-transform:capitalize}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .card h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 2px}
  .card .sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.4}
  .sec-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 12px}
  .dot{width:9px;height:9px;border-radius:50%}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:none}
  .row .lbl{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:500}
  .row .lbl .ico{font-size:19px;width:24px;text-align:center}
  .row .lbl small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:19px;color:var(--ink);font-weight:500;cursor:pointer;line-height:1;transition:.15s}
  .stepper button:active{transform:scale(.92);background:var(--bg)}
  .stepper .val{min-width:62px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .stepper .val small{color:var(--muted);font-weight:500;font-size:11px}

  input[type=text],input[type=number],input[type=time],select,textarea{
    font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:.15s
  }
  input:focus,select:focus,textarea:focus{border-color:var(--salud);background:var(--surface)}
  textarea{resize:vertical;min-height:60px}
  label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}

  .moods{display:flex;justify-content:space-between;gap:6px}
  .mood{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:14px;border:1.5px solid transparent;background:var(--surface2);cursor:pointer;transition:.15s}
  .mood .e{font-size:26px}.mood .t{font-size:10.5px;color:var(--muted);font-weight:600}
  .mood.sel{border-color:var(--emo);background:#fff;box-shadow:0 4px 14px rgba(224,169,46,.18)}
  .mood:active{transform:scale(.95)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;transition:.15s;color:var(--ink)}
  .chip.sel{background:var(--familia);border-color:var(--familia);color:#fff}
  .chip:active{transform:scale(.95)}

  .med{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .med:last-child{border-bottom:none}
  .check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;font-size:15px;color:#fff}
  .check.on{background:var(--salud);border-color:var(--salud)}
  .med .info{flex:1}.med .info .n{font-weight:600;font-size:15px}.med .info .h{font-size:12.5px;color:var(--muted)}
  .med .del{color:var(--muted);background:none;border:none;font-size:18px;cursor:pointer;padding:4px}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;border:none;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--ink);color:#fff}.btn-primary:active{transform:scale(.98);background:#444}
  .btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:14px;padding:12px}
  .btn-mente{background:var(--mente);color:#fff}
  .saved{text-align:center;font-size:13px;color:var(--salud);font-weight:600;height:18px;margin-top:8px;opacity:0;transition:.3s}
  .saved.show{opacity:1}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .v{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1}
  .kpi .v small{font-size:13px;color:var(--muted);font-family:'Outfit';font-weight:500}
  .kpi .k{font-size:12px;color:var(--muted);font-weight:600;margin-top:5px}

  .streaks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
  .streak .e{font-size:22px}.streak .n{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-top:2px}.streak .l{font-size:10px;color:var(--muted);font-weight:600}

  .chart{width:100%;height:300px}
  .seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .seg button{flex:1;min-width:fit-content;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .reflect{background:linear-gradient(135deg,#FBF8F1,#F3EAD8);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .reflect .q{font-family:'Fraunces',serif;font-style:italic;font-size:16px;line-height:1.5}

  .week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wk{background:var(--surface2);border-radius:13px;padding:12px 14px}
  .wk .v{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
  .wk .d{font-size:12px;font-weight:600;margin-left:6px}
  .wk .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
  .up{color:var(--salud)}.down{color:var(--cuerpo)}

  .ai-card{background:linear-gradient(150deg,#2C2A24,#3a3730);color:#F4EEE2;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
  .ai-card h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;color:#fff}
  .ai-card .sub{font-size:12px;color:#bdb6a6;margin-bottom:14px;line-height:1.45}
  .ai-out{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:15px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;margin-top:14px}
  .ai-disc{font-size:11px;color:#a59e8e;margin-top:12px;line-height:1.45}
  .btn-ai{background:var(--salud);color:#fff}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(252,250,244,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));z-index:50}
  nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 3px;cursor:pointer;color:var(--muted);font-family:inherit;transition:.15s;flex:1}
  nav.tabs button .ti{font-size:19px}.nav.tabs button .tl{font-size:10px}
  nav.tabs button .tl{font-size:9.5px;font-weight:600}
  nav.tabs button.on{color:var(--ink)}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 10px}
  .addbar{display:flex;gap:8px;margin-top:8px}
  .mini{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:0 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .mini:active{transform:scale(.96)}
  .addbar input{flex:1}.addbar input.t{flex:1.6}.addbar input.h{max-width:120px}.addbar input.e{max-width:64px;text-align:center;font-size:20px}
  .small-note{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.4}
  .item-line{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .item-line:last-child{border-bottom:none}.item-line .e{font-size:20px}.item-line .n{flex:1;font-weight:500}.item-line .r{font-size:12px;color:var(--muted)}
  .item-line .del{color:var(--muted);background:none;border:none;font-size:17px;cursor:pointer}
  .collapse{margin-top:10px;border-top:1px dashed var(--line);padding-top:12px}

  /* respiración */
  #breath{position:fixed;inset:0;z-index:100;background:radial-gradient(800px 800px at 50% 40%,#1e3a34,#10211d);display:none;flex-direction:column;align-items:center;justify-content:center;color:#eaf3ef}
  #breath.show{display:flex}
  .b-circle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(120,200,170,.9),rgba(60,130,110,.6));box-shadow:0 0 70px rgba(95,200,160,.45);display:flex;align-items:center;justify-content:center;transform:scale(.7);transition:transform 1s ease-in-out}
  .b-count{font-family:'Fraunces',serif;font-size:52px;font-weight:600;color:#fff}
  .b-phase{font-family:'Fraunces',serif;font-size:30px;margin-top:36px;letter-spacing:.02em}
  .b-info{font-size:13px;color:#9dc4b6;margin-top:8px}
  .b-actions{display:flex;gap:12px;margin-top:40px}
  .b-actions button{padding:13px 26px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .b-actions button.fin{background:#fff;color:#1e3a34;border:none}
  .hide{display:none}
  #rehearse{position:fixed;inset:0;z-index:100;background:radial-gradient(800px 800px at 50% 40%,#2a3a55,#101826);display:none;flex-direction:column;align-items:center;justify-content:center;color:#eaf0f8;padding:30px;text-align:center}
  #rehearse.show{display:flex}
  .rh-step{font-family:'Fraunces',serif;font-size:24px;line-height:1.5;max-width:430px}
  .rh-count{font-size:14px;color:#9fb3d0;margin-top:20px}
  /* ===== mascota ===== */
  .pet-scene{position:relative;height:380px;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;
    box-shadow:var(--shadow), inset 0 -40px 70px rgba(60,34,12,.20), inset 0 18px 40px rgba(255,240,210,.35);
    background:linear-gradient(180deg,#ffe9c4 0%,#ffd9a0 30%,#f4c79a 50%,#cfe6a6 51%,#a9d680 78%,#8cc566 100%);}
  .pet-glow{position:absolute;left:50%;top:40%;width:330px;height:330px;transform:translate(-50%,-50%);border-radius:50%;z-index:1;
    background:radial-gradient(circle,rgba(255,247,214,.85) 0%,rgba(255,228,150,.45) 40%,rgba(255,228,150,0) 70%)}
  .pet-hill{position:absolute;left:50%;bottom:-90px;width:150%;height:280px;transform:translateX(-50%);border-radius:50%;z-index:1;
    background:radial-gradient(ellipse at 50% 40%,#bfe18c 0%,#9bce6a 55%,#7bbb56 100%);box-shadow:inset 0 14px 30px rgba(255,255,255,.25)}
  .pet-platform{position:absolute;left:50%;bottom:48px;width:240px;height:54px;transform:translateX(-50%);border-radius:50%;z-index:1;
    background:radial-gradient(ellipse at center,rgba(40,22,8,.34) 0%,rgba(40,22,8,.16) 45%,rgba(40,22,8,0) 72%)}
  .pet-sun{position:absolute;top:26px;right:30px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff3b0,#ffd24d 70%,#ffb43a 100%);box-shadow:0 0 42px rgba(255,196,70,.8);z-index:1}
  .pet-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;z-index:2}
  .pet-canvas{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;z-index:2}
  .pet-canvas canvas{width:100%!important;height:100%!important;display:block}
  .pet-svg.s-fit .l-bodyfat{transform:scaleX(.9)}
  .pet-svg{width:250px;height:330px;margin-bottom:0;transform-origin:50% 92%;animation:petBob 3.4s ease-in-out infinite;filter:drop-shadow(0 22px 16px rgba(50,28,10,.34))}
  @keyframes petBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1deg)}}
  .pet-svg.walk{animation:petWalk 2.4s ease-in-out}
  @keyframes petWalk{0%{transform:translateX(0)}25%{transform:translateX(-46px) rotate(-3deg)}50%{transform:translateX(-46px) scaleX(-1)}75%{transform:translateX(40px) scaleX(-1) rotate(3deg)}100%{transform:translateX(0) scaleX(1)}}
  .pet-svg.happy{animation:petHappy .6s ease}
  @keyframes petHappy{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.05)}60%{transform:translateY(0) scale(.96)}}
  .pet-svg.ouch{animation:petOuch .5s ease}
  @keyframes petOuch{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-4deg)}40%{transform:translateX(9px) rotate(4deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

  /* capas por estado (se muestran/ocultan con clases en .pet-svg) */
  .l-aura{opacity:0;transition:opacity .5s} .pet-svg.s-aura .l-aura{opacity:1;animation:auraPulse 3s ease-in-out infinite}
  @keyframes auraPulse{0%,100%{opacity:.55}50%{opacity:.95}}
  .l-purple{opacity:0;transition:opacity .4s} .pet-svg.s-gasp .l-purple{opacity:.5}
  .l-bubbles{opacity:0} .pet-svg.s-gasp .l-bubbles{opacity:1;animation:bub 1.4s linear infinite}
  @keyframes bub{0%{transform:translateY(0);opacity:.0}30%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
  .l-bags{opacity:0} .pet-svg.s-tired .l-bags{opacity:.8}
  .l-brows{opacity:0} .pet-svg.s-angry .l-brows{opacity:1}
  .l-empty{opacity:0} .pet-svg.s-empty .l-empty{opacity:1;animation:auraPulse 2.5s ease-in-out infinite}
  .l-bodyfat{transform:scaleX(1);transform-origin:50% 70%;transition:transform .5s} .pet-svg.s-fat .l-bodyfat{transform:scaleX(1.3)}
  .heart-fill{fill:#e8537a;transition:fill .4s} .pet-svg.s-dimheart .heart-fill{fill:#9a9a9a}
  /* bocas por ánimo */
  .m-happy,.m-angry,.m-tired,.m-gasp{opacity:0}
  .pet-svg.mood-happy .m-happy{opacity:1}
  .pet-svg.mood-angry .m-angry{opacity:1}
  .pet-svg.mood-tired .m-tired{opacity:1}
  .pet-svg.mood-gasp .m-gasp{opacity:1}
  /* parpadeo y ojos cansados (sobre #eye_left/#eye_right) */
  #eye_left,#eye_right{transform-box:fill-box;transform-origin:center;transition:transform .12s ease}
  .pet-svg.blink #eye_left,.pet-svg.blink #eye_right{transform:scaleY(.1)}
  .pet-svg.mood-tired #eye_left,.pet-svg.mood-tired #eye_right{transform:scaleY(.55)}
  #pupil_left,#pupil_right{transition:transform .14s ease}

  .pet-bubble{position:absolute;left:50%;top:18px;transform:translateX(-50%) scale(.6);background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);opacity:0;transition:.25s;white-space:nowrap;pointer-events:none;z-index:5}
  .pet-bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
  .pet-bubble:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff}
  .heartpop{position:absolute;font-size:22px;pointer-events:none;animation:hpop 1.1s ease-out forwards;z-index:6}
  @keyframes hpop{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}

  .pet-status{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .ps{display:flex;align-items:center;gap:9px;background:var(--surface2);border-radius:12px;padding:9px 11px;font-size:12.5px;font-weight:500}
  .ps .pe{font-size:17px}
  .ps.ok{border-left:3px solid var(--salud)} .ps.bad{border-left:3px solid var(--cuerpo)}
  .ps .st{font-size:10.5px;color:var(--muted);display:block}
  .lvlbar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:8px}
  .lvlbar > i{display:block;height:100%;background:linear-gradient(90deg,#5FA382,#9ad0b0);border-radius:999px;transition:width .6s}
  .pupilgrp{transition:transform .14s ease}
  .mouthgrp{transform-box:fill-box;transform-origin:center}
  .pet-svg.talk .mouthgrp{animation:talk .26s ease 3}
  @keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
  .pet-scene.night{background:linear-gradient(180deg,#16213f 0%,#243456 34%,#2f4566 50%,#2a4a39 51%,#22402f 78%,#1b3526 100%)}
  .pet-scene.night .pet-sun{background:radial-gradient(circle at 38% 38%,#fdfbe7,#dfe4ef 70%,#c4ccdd 100%);box-shadow:0 0 30px rgba(220,226,240,.6)}
  .pet-scene.night .pet-glow{background:radial-gradient(circle,rgba(190,205,240,.45) 0%,rgba(150,170,220,.18) 42%,rgba(150,170,220,0) 70%)}
  .pet-scene.night .pet-hill{background:radial-gradient(ellipse at 50% 40%,#2f5340 0%,#264433 55%,#1d3527 100%);box-shadow:inset 0 14px 30px rgba(255,255,255,.08)}
  .confetti{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:6;animation:confFall linear forwards}
  @keyframes confFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(360px) rotate(540deg);opacity:0}}
  .grid40{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
  .cell40{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.12s}
  .cell40.on{background:var(--salud);color:#fff;border-color:var(--salud);font-weight:600}
  .cell40:active{transform:scale(.9)}
  /* lock */
  #lock{position:fixed;inset:0;z-index:120;background:radial-gradient(700px 700px at 50% 35%,#3a5a52,#10211d);display:none;flex-direction:column;align-items:center;justify-content:center}
  #lock.show{display:flex}
  .lock-box{display:flex;flex-direction:column;align-items:center;width:80%;max-width:300px}
  .lock-ico{font-size:40px;margin-bottom:6px}
  .lock-title{font-family:'Fraunces',serif;font-size:26px;color:#fff;margin-bottom:24px}
  #pinInput{text-align:center;font-size:30px;letter-spacing:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:14px;width:100%;margin-bottom:16px}
  #pinGo{width:100%;padding:14px;border-radius:14px;border:none;background:#5FA382;color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .lock-err{color:#f0b8a0;font-size:13px;height:18px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Equi<span>librio</span></div>
    <div class="today" id="todayLbl"></div>
  </header>
  <div id="view"></div>
</div>

<nav class="tabs" id="nav">
  <button data-tab="hoy" class="on"><span class="ti">✍️</span><span class="tl">Hoy</span></button>
  <button data-tab="mascota"><span class="ti">🐾</span><span class="tl">Mascota</span></button>
  <button data-tab="balance"><span class="ti">🧭</span><span class="tl">Balance</span></button>
  <button data-tab="crecer"><span class="ti">🌱</span><span class="tl">Crecer</span></button>
  <button data-tab="graficas"><span class="ti">📈</span><span class="tl">Gráficas</span></button>
  <button data-tab="medicinas"><span class="ti">💊</span><span class="tl">Medicina</span></button>
  <button data-tab="mas"><span class="ti">⚙️</span><span class="tl">Más</span></button>
</nav>

<!-- Bloqueo con PIN -->
<div id="lock">
  <div class="lock-box">

    <input type="text" id="pinInput" inputmode="numeric" pattern="\d*" maxlength="4" placeholder="••••">

  </div>
</div>

<!-- Guía de respiración -->
<div id="breath">
  <div class="b-circle" id="bCircle"><div class="b-count" id="bCount">7</div></div>
  <div class="b-phase" id="bPhase">Prepárate…</div>
  <div class="b-info" id="bInfo">Ciclo 0 · 7-6-7-6</div>
  <div class="b-actions">
    <button id="bToggle">Pausar</button>
    <button class="fin" id="bFin">Terminar</button>
  </div>
</div>

<!-- Ensayo mental guiado -->
<div id="rehearse">
  <div class="rh-step" id="rhStep">…</div>
  <div class="rh-count" id="rhCount"></div>
  <div class="b-actions">
    <button id="rhToggle">Pausar</button>
    <button id="rhSkip">Saltar</button>
    <button class="fin" id="rhFin">Terminar</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- almacenamiento: window.storage (Claude) → localStorage (publicada) → memoria ---------- */
  var mem={};
  function lsGet(k){ try{ if(window.localStorage){ var x=localStorage.getItem(k); if(x!=null)return x; } }catch(e){} return (mem[k]!==undefined?mem[k]:null); }
  function lsSet(k,v){ try{ if(window.localStorage) localStorage.setItem(k,v); }catch(e){} }
  var store={
    get:function(k){ return Promise.resolve().then(function(){
      if(window.storage) return window.storage.get(k).then(function(r){return r?r.value:null;}).catch(function(){return lsGet(k);});
      return lsGet(k); }); },
    set:function(k,v){ mem[k]=v; return Promise.resolve().then(function(){
      if(window.storage) return window.storage.set(k,v).catch(function(){ lsSet(k,v); });
      lsSet(k,v); }); }
  };

  /* ---------- estado ---------- */
  var days={}, meds=[], members=[], activities=[], settings={}, growth={};
  var tab="hoy", chart=null, radar=null, reminderTimers=[], saveT=null, unlocked=false, petTimer=null, petTaps=[], pet3d=null, curGrowth="habitos";

  var DEPORTES=["Caminar","Trotar","Bicicleta","Gimnasio","Natación","Fútbol","Yoga","Otro"];
  var EMOCIONES=["En paz","Agradecido","Feliz","Motivado","Esperanzado","Tranquilo","Cansado","Estresado","Ansioso","Triste","Irritado","Abrumado"];
  var MOODS=[{v:1,e:"😣",t:"Muy bajo"},{v:2,e:"😕",t:"Bajo"},{v:3,e:"😐",t:"Neutro"},{v:4,e:"🙂",t:"Bien"},{v:5,e:"😄",t:"Muy bien"}];
  var REFLEX=["¿Qué momento de hoy con tu familia quieres recordar?","¿Qué le agradeces a este día, por pequeño que sea?","¿Qué cuidó hoy tu cuerpo y qué cuidó tu mente?","Si mañana solo pudieras mejorar una cosa, ¿cuál sería?","¿Cuándo te sentiste más en paz hoy?","¿Qué te robó energía y qué te la devolvió?"];
  var FAM_COLORS=["#C4577A","#E0789E","#9B5C8C","#6E4B8C","#B05A6E","#8A4B7D","#C77FA0"];
  var DEFAULT_MEMBERS=[
    {id:"smit",name:"Smit",role:"Hijo",emoji:"🧒"},
    {id:"laura",name:"Laura",role:"Hija",emoji:"👧"},
    {id:"matias",name:"Matías",role:"Hijo",emoji:"🧒"},
    {id:"esposa",name:"Esposa",role:"Esposa",emoji:"💑"},
    {id:"madre",name:"Madre",role:"Madre",emoji:"👩"},
    {id:"padre",name:"Padre",role:"Padre",emoji:"👨"}
  ];
  var DEFAULT_SETTINGS={metaMente:30,metaCuerpo:30,metaFamilia:60,metaRespira:10,notif:false,pet3d:true};

  function todayKey(){ return offsetKey(0); }
  function offsetKey(off){ var d=new Date(); d.setDate(d.getDate()+off); var m=d.getMonth()+1,day=d.getDate(); return d.getFullYear()+"-"+(m<10?"0"+m:m)+"-"+(day<10?"0"+day:day); }
  function fmtToday(){ return new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'}); }
  function uid(p){ return (p||"x")+Date.now()+Math.floor(Math.random()*1000); }
  function blankDay(){ return {lectura:0,meditacion:0,oracion:0,respiracion:0,deporte:0,deporteTipo:"",sueno:0,libro:{titulo:"",nota:""},animo:null,emociones:[],familia:{},custom:{},peso:null,meds:{},nota:""}; }
  function getDay(k){ if(!days[k]) days[k]=blankDay(); var d=days[k];
    if(!d.familia)d.familia={}; if(!d.custom)d.custom={}; if(!d.libro)d.libro={titulo:"",nota:""}; if(!d.emociones)d.emociones=[]; if(!d.meds)d.meds={}; return d; }

  function persist(key,obj){ store.set(key,JSON.stringify(obj)); }
  function persistDays(){ persist("eq:days",days); }

  /* ---------- arranque ---------- */
  function boot(){
    document.getElementById("todayLbl").textContent=fmtToday();
    Promise.all([store.get("eq:days"),store.get("eq:meds"),store.get("eq:members"),store.get("eq:activities"),store.get("eq:settings"),store.get("eq:growth")]).then(function(r){
      days=parse(r[0],{}); meds=parse(r[1],[]); members=parse(r[2],null); activities=parse(r[3],[]); settings=parse(r[4],null); growth=parse(r[5],null);
      if(!members||!members.length){ members=DEFAULT_MEMBERS.slice(); persist("eq:members",members); }
      if(!settings){ settings={}; for(var s in DEFAULT_SETTINGS) settings[s]=DEFAULT_SETTINGS[s]; persist("eq:settings",settings); }
      for(var d in DEFAULT_SETTINGS){ if(settings[d]===undefined) settings[d]=DEFAULT_SETTINGS[d]; }
      if(!growth) growth={};
      if(!growth.identity)growth.identity=[]; if(!growth.stacks)growth.stacks=[]; if(growth.futureSelf===undefined)growth.futureSelf=""; if(!growth.patterns)growth.patterns=[]; if(!growth.reframes)growth.reframes=[];
      if(growth.purpose===undefined)growth.purpose=""; if(!growth.values)growth.values=[]; if(!growth.reto)growth.reto={meta:"",marcas:[]};
      if(!growth.power)growth.power=[]; if(!growth.afirmaciones)growth.afirmaciones=[]; if(growth.metaGrande===undefined)growth.metaGrande="";
      if(!growth.people)growth.people=[]; if(!growth.aprecios)growth.aprecios=[];
      if(!growth.books){ growth.books=[
        {id:uid("bk"),title:"Hábitos atómicos",author:"James Clear",pages:0,current:0,notes:[],done:false},
        {id:uid("bk"),title:"Deja de ser tú",author:"Joe Dispenza",pages:0,current:0,notes:[],done:false},
        {id:uid("bk"),title:"El poder del pensamiento flexible",author:"Walter Riso",pages:0,current:0,notes:[],done:false},
        {id:uid("bk"),title:"Una vida con propósito",author:"Rick Warren",pages:0,current:0,notes:[],done:false},
        {id:uid("bk"),title:"Vendes o vendes",author:"Grant Cardone",pages:0,current:0,notes:[],done:false},
        {id:uid("bk"),title:"Cómo ganar amigos e influir sobre las personas",author:"Dale Carnegie",pages:0,current:0,notes:[],done:false}
      ]; persistGrowth(); }
      if(!growth.weekly)growth.weekly={win:"",adjust:"",focus:"",date:""};
      scheduleReminders();
      if(settings.pin && !unlocked) showLock(); else render();
    });
    document.getElementById("nav").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b)return;
      tab=b.getAttribute("data-tab");
      var btns=document.querySelectorAll("#nav button"); for(var i=0;i<btns.length;i++) btns[i].classList.toggle("on",btns[i]===b);
      render(); });
    initBreath(); initLock(); initRehearse();
  }
  function showLock(){ document.getElementById("lock").classList.add("show"); var i=document.getElementById("pinInput"); if(i){ i.value=""; setTimeout(function(){i.focus();},200); } }
  function tryUnlock(){ var i=document.getElementById("pinInput"); var err=document.getElementById("pinErr");
    if(i.value===settings.pin){ unlocked=true; document.getElementById("lock").classList.remove("show"); render(); }
    else { err.textContent="PIN incorrecto"; i.value=""; setTimeout(function(){err.textContent="";},1500); } }
  function initLock(){ var b=document.getElementById("pinGo"); if(b)b.addEventListener("click",tryUnlock);
    var i=document.getElementById("pinInput"); if(i)i.addEventListener("keydown",function(e){ if(e.key==="Enter")tryUnlock(); }); }
  function parse(s,def){ try{ return s?JSON.parse(s):def; }catch(e){ return def; } }

  function render(){
    if(chart){chart.dispose();chart=null;} if(radar){radar.dispose();radar=null;}
    if(petTimer){clearInterval(petTimer);petTimer=null;}
    if(pet3d){ try{pet3d.dispose();}catch(e){} pet3d=null; }
    var v=document.getElementById("view");
    if(tab==="hoy")v.innerHTML=viewHoy();
    else if(tab==="mascota")v.innerHTML=viewMascota();
    else if(tab==="crecer")v.innerHTML=viewCrecer();
    else if(tab==="balance")v.innerHTML=viewBalance();
    else if(tab==="graficas")v.innerHTML=viewGraficas();
    else if(tab==="medicinas")v.innerHTML=viewMedicinas();
    else if(tab==="mas")v.innerHTML=viewMas();
    bind();
  }

  /* ===================== HOY ===================== */
  function minStepper(field,label,ico,step,sub){
    var d=getDay(todayKey());
    return '<div class="row"><div class="lbl"><span class="ico">'+ico+'</span><span>'+label+(sub?'<small>'+sub+'</small>':'')+'</span></div>'+
      '<div class="stepper" data-field="'+field+'" data-step="'+(step||5)+'"><button data-act="dec">−</button>'+
      '<span class="val">'+(d[field]||0)+' <small>min</small></span><button data-act="inc">+</button></div></div>';
  }
  function viewHoy(){
    var d=getDay(todayKey()); var h="";

    // Mente y espíritu
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--mente)"></span>Mente & espíritu</div>'+
      minStepper("lectura","Lectura","📖",5)+
      '<div class="collapse" style="margin-top:0;border:none;padding-top:8px">'+
        '<label class="fld">📚 ¿Qué libro estás leyendo?</label>'+
        '<input type="text" id="libroTit" placeholder="Título del libro" value="'+esc(d.libro.titulo)+'">'+
        '<label class="fld" style="margin-top:10px">✍️ Algo que te impactó (opcional)</label>'+
        '<textarea id="libroNota" placeholder="Una frase, idea o aprendizaje que quieras recordar…">'+esc(d.libro.nota)+'</textarea>'+
      '</div>'+
      minStepper("meditacion","Meditación","🧘",5)+
      minStepper("oracion","Oración","🙏",5)+
      minStepper("respiracion","Respiración","🌬️",1)+
      '<button class="btn btn-mente" id="openBreath" style="margin-top:12px">🌬️ Iniciar guía de respiración 7·6·7·6</button>'+
    '</div>';

    // Otros hábitos personalizados
    if(activities.length){
      var hb="";
      for(var a=0;a<activities.length;a++){ var ac=activities[a]; var val=(d.custom[ac.id]||0);
        hb+='<div class="row"><div class="lbl"><span class="ico">'+ac.emoji+'</span>'+esc(ac.name)+'</div>'+
          '<div class="stepper" data-custom="'+ac.id+'" data-step="5"><button data-act="dec">−</button>'+
          '<span class="val">'+val+' <small>min</small></span><button data-act="inc">+</button></div></div>';
      }
      h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--mente)"></span>Otros hábitos</div>'+hb+'</div>';
    }

    // Cuerpo
    var opts=""; for(var i=0;i<DEPORTES.length;i++) opts+='<option'+(d.deporteTipo===DEPORTES[i]?' selected':'')+'>'+DEPORTES[i]+'</option>';
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--cuerpo)"></span>Cuerpo</div>'+
      minStepper("deporte","Deporte","💪",5)+
      '<div style="padding:11px 0;border-bottom:1px dashed var(--line)"><label class="fld">¿Qué deporte / actividad?</label>'+
        '<select id="depTipo"><option value="">Seleccionar…</option>'+opts+'</select></div>'+
      '<div style="padding-top:11px"><label class="fld">Peso (kg)</label>'+
        '<input type="number" step="0.1" id="peso" placeholder="Ej: 84,5" value="'+(d.peso!=null?d.peso:"")+'">'+
        '<div class="small-note">Sugerencia: pésate 1–2 veces por semana, a la misma hora. Lo que importa es la tendencia, no el número de un día.</div></div></div>';

    // Descanso
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:#7E8FE0"></span>Descanso</div>'+
      '<div class="row"><div class="lbl"><span class="ico">😴</span>Horas dormidas</div>'+
      '<div class="stepper" data-sleep="1" data-step="0.5"><button data-act="dec">−</button>'+
      '<span class="val">'+(d.sueno||0)+' <small>h</small></span><button data-act="inc">+</button></div></div></div>';

    // Ánimo + emociones
    var moodsH=""; for(var j=0;j<MOODS.length;j++){ var m=MOODS[j]; moodsH+='<div class="mood'+(d.animo===m.v?' sel':'')+'" data-mood="'+m.v+'"><span class="e">'+m.e+'</span><span class="t">'+m.t+'</span></div>'; }
    var chipsH=""; for(var e=0;e<EMOCIONES.length;e++){ var sel=d.emociones.indexOf(EMOCIONES[e])>=0; chipsH+='<span class="chip'+(sel?' sel':'')+'" data-emo="'+EMOCIONES[e]+'">'+EMOCIONES[e]+'</span>'; }
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--emo)"></span>Estado de ánimo</div>'+
      '<div class="moods">'+moodsH+'</div>'+
      '<label class="fld" style="margin-top:16px">¿Qué emociones sentiste hoy?</label><div class="chips">'+chipsH+'</div></div>';

    // Familia (miembros)
    var famH="";
    for(var f=0;f<members.length;f++){ var mb=members[f]; var fv=(d.familia[mb.id]||0);
      famH+='<div class="row"><div class="lbl"><span class="ico">'+mb.emoji+'</span><span>'+esc(mb.name)+'<small>'+esc(mb.role)+'</small></span></div>'+
        '<div class="stepper" data-fam="'+mb.id+'" data-step="10"><button data-act="dec">−</button>'+
        '<span class="val">'+fv+' <small>min</small></span><button data-act="inc">+</button></div></div>';
    }
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--familia)"></span>Tiempo en familia</div>'+famH+
      '<div class="small-note">Para agregar o editar personas ve a la pestaña ⚙️ Más.</div></div>';

    // Medicinas
    var medsH="";
    if(meds.length===0) medsH='<div class="empty">Aún no agregas medicinas. Ve a 💊 Medicina.</div>';
    else for(var k=0;k<meds.length;k++){ var md=meds[k]; var on=!!d.meds[md.id];
      medsH+='<div class="med"><div class="check'+(on?' on':'')+'" data-med="'+md.id+'">'+(on?'✓':'')+'</div>'+
        '<div class="info"><div class="n">'+esc(md.nombre)+'</div><div class="h">'+(md.hora?'🕐 '+md.hora:'')+(md.dosis?' · '+esc(md.dosis):'')+'</div></div></div>'; }
    h+='<div class="card"><div class="sec-label"><span class="dot" style="background:var(--salud)"></span>Medicinas de hoy</div>'+medsH+'</div>';

    h+='<div class="card"><label class="fld">Nota del día (opcional)</label>'+
      '<textarea id="nota" placeholder="¿Cómo te fue hoy? Algo que quieras recordar…">'+esc(d.nota||"")+'</textarea></div>';
    h+='<button class="btn btn-primary" id="saveBtn">Guardar ahora</button><div class="saved show" id="savedMsg" style="opacity:1">Se guarda solo a cada cambio ✓</div>';
    return h;
  }

  /* ===================== MASCOTA ===================== */
  var PET_KS=['oracion','dormir','ejercicio','familia','lectura','meditacion','respiracion'];
  function petState(d){ d=d||{}; var fam=0; if(d.familia)for(var k in d.familia)fam+=d.familia[k]||0;
    return {oracion:(d.oracion||0)>0,dormir:(d.sueno||0)>=6,ejercicio:(d.deporte||0)>0,familia:fam>0,lectura:(d.lectura||0)>0,meditacion:(d.meditacion||0)>0,respiracion:(d.respiracion||0)>0}; }
  function petDone(st){ var n=0; for(var i=0;i<PET_KS.length;i++) if(st[PET_KS[i]])n++; return n; }
  function petClasses(st){ var c=[]; if(st.oracion)c.push('s-aura'); if(!st.ejercicio)c.push('s-fat'); else c.push('s-fit'); if(!st.familia)c.push('s-dimheart'); if(!st.lectura)c.push('s-empty');
    if(!st.respiracion)c.push('mood-gasp','s-gasp'); else if(!st.meditacion)c.push('mood-angry','s-angry'); else if(!st.dormir)c.push('mood-tired','s-tired'); else c.push('mood-happy');
    return c.join(' '); }
  function petXP(){ var x=0; for(var k in days) x+=petDone(petState(days[k])); return x; }

  /* Koa 3D real: si existe koa.glb junto a la app (versión publicada), se carga con three.js.
     Mide por huesos (los modelos de Meshy traen el tamaño en el esqueleto), refleja el avance
     diario con aura/corazón/pensamiento/burbujas/tinte/velocidad, y cae al Koa vectorial si falla. */
  function tryGLB(cont){
    if(window.__glbOff || !window.THREE) return;
    function start(){
      try{
        var L=new THREE.GLTFLoader();
        L.load('koa.glb',function(g){
          try{
            if(!document.body.contains(cont)) return;
            var W=cont.clientWidth||340,H=cont.clientHeight||360;
            var ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
            ren.setSize(W,H); ren.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
            if(THREE.sRGBEncoding!==undefined){ ren.outputEncoding=THREE.sRGBEncoding; }
            var scene=new THREE.Scene();
            var cam=new THREE.PerspectiveCamera(34,W/H,0.05,80);
            scene.add(new THREE.HemisphereLight(0xfff4dc,0x6b8f5a,1.05));
            var key=new THREE.DirectionalLight(0xffe9c0,0.95); key.position.set(2.2,3.5,3); scene.add(key);
            var rim=new THREE.DirectionalLight(0xbfd9ff,0.5); rim.position.set(-2.5,2,-2.5); scene.add(rim);

            var model=g.scene, root=new THREE.Group(); root.add(model); scene.add(root);
            var mixer=null,action=null,baseSpeed=0.5;
            if(g.animations&&g.animations.length){ mixer=new THREE.AnimationMixer(model); action=mixer.clipAction(g.animations[0]); action.play(); }

            /* Medición por HUESOS (la geometría de Meshy no refleja la escala real) */
            function measure(){
              model.updateMatrixWorld(true); if(mixer)mixer.update(0.0001);
              model.updateMatrixWorld(true);
              var bx=new THREE.Box3(), v=new THREE.Vector3(), nb=0;
              model.traverse(function(o){ if(o.isBone){ o.getWorldPosition(v); bx.expandByPoint(v); nb++; } });
              if(nb<3 || !isFinite(bx.min.y) || bx.getSize(new THREE.Vector3()).y<=0){ bx.setFromObject(model); }
              return bx;
            }
            var box=measure(), size=box.getSize(new THREE.Vector3());
            var s=1.5/Math.max(size.y*1.12,0.0001);   /* 12% extra por la coronilla (los huesos llegan al cuello) */
            model.scale.multiplyScalar(s);
            box=measure(); var ctr=box.getCenter(new THREE.Vector3());
            model.position.x-=ctr.x; model.position.z-=ctr.z; model.position.y-=box.min.y;
            box=measure(); size=box.getSize(new THREE.Vector3());
            var h=Math.max(size.y,0.8), front=size.z/2+0.12;
            cam.position.set(0,h*0.62,h*2.35); cam.lookAt(0,h*0.5,0);

            /* Sprites de estado */
            function canvasSprite(draw,sz,additive){ var c=document.createElement('canvas'); c.width=c.height=128;
              draw(c.getContext('2d')); var t=new THREE.CanvasTexture(c);
              var m=new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false});
              if(additive)m.blending=THREE.AdditiveBlending;
              var sp=new THREE.Sprite(m); sp.scale.set(sz,sz,1); return sp; }
            function emoji(ch){ return function(gx){ gx.font='100px serif'; gx.textAlign='center'; gx.textBaseline='middle'; gx.fillText(ch,64,72); }; }
            var aura=canvasSprite(function(gx){ var gr=gx.createRadialGradient(64,64,6,64,64,62);
              gr.addColorStop(0,'rgba(255,244,190,.95)'); gr.addColorStop(.55,'rgba(255,214,110,.45)'); gr.addColorStop(1,'rgba(255,214,110,0)');
              gx.fillStyle=gr; gx.fillRect(0,0,128,128); }, h*1.9, true);
            aura.position.set(0,h*0.52,-0.55); scene.add(aura);
            var heartOK=canvasSprite(emoji('💗'),h*0.26); heartOK.position.set(0,h*0.56,front); root.add(heartOK);
            var heartBad=canvasSprite(emoji('🤍'),h*0.24); heartBad.material.opacity=0.55; heartBad.position.copy(heartOK.position); root.add(heartBad);
            var thought=canvasSprite(emoji('💭'),h*0.34); thought.position.set(h*0.22,h*1.16,0); root.add(thought);
            var bub=canvasSprite(function(gx){ gx.fillStyle='rgba(170,215,255,.95)';
              gx.beginPath(); gx.arc(46,86,17,0,7); gx.fill(); gx.beginPath(); gx.arc(82,52,12,0,7); gx.fill();
              gx.beginPath(); gx.arc(64,22,8,0,7); gx.fill(); }, h*0.34);
            bub.position.set(h*0.30,h*0.80,front*0.6); root.add(bub);

            /* Tinte emotivo sobre los materiales */
            var mats=[]; model.traverse(function(o){ if(o.isMesh&&o.material&&o.material.emissive) mats.push(o.material); });
            function tint(hex,inten){ for(var i=0;i<mats.length;i++){ mats[i].emissive.setHex(hex); mats[i].emissiveIntensity=inten; } }

            var sBase=s;
            function setSt(st){
              if(!st)return;
              aura.visible=!!st.oracion;
              heartOK.visible=!!st.familia; heartBad.visible=!st.familia;
              thought.visible=!st.lectura;
              bub.visible=!st.respiracion;
              if(!st.respiracion) tint(0x4a2a86,0.45);          /* morado: le falta el aire */
              else if(!st.meditacion) tint(0x6e1414,0.35);      /* rojizo: enojado sin meditar */
              else tint(0x000000,0);

  /* --- texturas para sprites 3D --- */

  /* --- motor 3D de Koa (three.js) --- */
  function initPet3D(container){
    var W=container.clientWidth||280, H=container.clientHeight||320;
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(42, W/H, 0.1, 100);

    container.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xffffff,0.72));
    var key=new THREE.DirectionalLight(0xffffff,0.95); key.position.set(-3,4,5); scene.add(key);
    var fill=new THREE.DirectionalLight(0xcfe0ff,0.32); fill.position.set(4,-1,3); scene.add(fill);
    var rim=new THREE.DirectionalLight(0xffe6b0,0.42); rim.position.set(2,3,-4); scene.add(rim);

    var g=new THREE.Group(); scene.add(g);
    var BODY=0xa85a36, BELLY=0xe9c9a0, DARK=0x6e3a22;
    var bodyMat=new THREE.MeshStandardMaterial({color:BODY,roughness:0.72,metalness:0});
    var bellyMat=new THREE.MeshStandardMaterial({color:BELLY,roughness:0.82});
    var earInMat=new THREE.MeshStandardMaterial({color:0xc98f55,roughness:0.85});
    function sph(r){ return new THREE.SphereGeometry(r,28,28); }
    function mesh(geo,mat,x,y,z){ var m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); g.add(m); return m; }

    var body=mesh(sph(1.15),bodyMat,0,-0.1,0); body.scale.set(0.95,1.25,0.95);
    var belly=mesh(sph(0.82),bellyMat,0,-0.32,0.6); belly.scale.set(0.82,1.0,0.45);
    function ear(side){ var e=mesh(sph(0.4),bodyMat,side*0.82,1.12,-0.05); e.scale.set(0.36,0.6,0.22); var ei=mesh(sph(0.4),earInMat,side*0.8,1.08,0.05); ei.scale.set(0.2,0.4,0.16); }
    ear(-1); ear(1);
    mesh(sph(0.18),new THREE.MeshStandardMaterial({color:DARK,roughness:0.85}),0,1.22,0.18).scale.set(1.3,0.8,0.8);
    var armL=mesh(sph(0.34),bodyMat,-1.02,-0.32,0.32); armL.scale.set(0.55,0.95,0.55); armL.rotation.z=0.5;
    var armR=mesh(sph(0.34),bodyMat,1.02,-0.32,0.32); armR.scale.set(0.55,0.95,0.55); armR.rotation.z=-0.5;
    mesh(sph(0.34),bodyMat,-0.45,-1.5,0.45).scale.set(1,0.6,1.25);
    mesh(sph(0.34),bodyMat,0.45,-1.5,0.45).scale.set(1,0.6,1.25);
    mesh(sph(0.66),bellyMat,0,-0.04,0.78).scale.set(1.08,0.9,0.72);

    var eyeWhiteMat=new THREE.MeshPhongMaterial({color:0xffffff,shininess:90,specular:0x666666});
    var irisMat=new THREE.MeshStandardMaterial({color:0x55b77c,roughness:0.38});
    var pupilMat=new THREE.MeshPhongMaterial({color:0x140d10,shininess:120,specular:0x888888});
    var hiMat=new THREE.MeshBasicMaterial({color:0xffffff});
    function eye(side){ var grp=new THREE.Group(); g.add(grp);
      var w=new THREE.Mesh(sph(0.37),eyeWhiteMat); w.scale.set(1,1.14,0.7); grp.add(w);
      grp.add(posm(new THREE.Mesh(sph(0.2),irisMat),side*0.02,-0.02,0.28));
      grp.add(posm(new THREE.Mesh(sph(0.12),pupilMat),side*0.02,-0.02,0.37));
      grp.add(posm(new THREE.Mesh(sph(0.06),hiMat),side*0.02+0.08,0.1,0.42));
      grp.position.set(side*0.43,0.4,0.92); grp._open=1; return grp; }
    function posm(m,x,y,z){ m.position.set(x,y,z); return m; }
    var eyeL=eye(-1), eyeR=eye(1);
    mesh(sph(0.2),new THREE.MeshPhongMaterial({color:0x271919,shininess:120,specular:0x888888}),0,0.1,1.16).scale.set(1.3,1.05,1.0);
    var cheekMat=new THREE.MeshBasicMaterial({color:0xff8f7a,transparent:true,opacity:0.45,depthWrite:false});
    mesh(sph(0.2),cheekMat,-0.6,0.02,0.95).scale.set(1,0.7,0.4);
    mesh(sph(0.2),cheekMat,0.6,0.02,0.95).scale.set(1,0.7,0.4);
    var browMat=new THREE.MeshStandardMaterial({color:0x4a2a18,roughness:0.9});
    var browL=mesh(new THREE.BoxGeometry(0.34,0.08,0.1),browMat,-0.42,0.74,1.0); browL.rotation.z=-0.35; browL.visible=false;
    var browR=mesh(new THREE.BoxGeometry(0.34,0.08,0.1),browMat,0.42,0.74,1.0); browR.rotation.z=0.35; browR.visible=false;

    var mouthMat=new THREE.MeshBasicMaterial({color:0x2e2020});
    function arc(){ return new THREE.TorusGeometry(0.26,0.045,8,22,Math.PI); }
    var mHappy=mesh(arc(),mouthMat,0,-0.18,1.04); mHappy.rotation.z=Math.PI;
    var mAngry=mesh(arc(),mouthMat,0,-0.1,1.04);
    var mTired=mesh(new THREE.BoxGeometry(0.34,0.05,0.05),mouthMat,0,-0.18,1.05);
    var mGasp=mesh(sph(0.13),new THREE.MeshStandardMaterial({color:0x3a2020,roughness:0.6}),0,-0.18,1.0); mGasp.scale.set(0.8,1,0.6);
    var tongue=mesh(sph(0.1),new THREE.MeshStandardMaterial({color:0xd9607a,roughness:0.6}),0,-0.26,1.1); tongue.scale.set(1.1,0.7,0.6);

    function spr(tex,scale,x,y,z,add){ var mt=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}); if(add)mt.blending=THREE.AdditiveBlending; var s=new THREE.Sprite(mt); s.scale.set(scale,scale,1); s.position.set(x,y,z); g.add(s); return s; }
    var heartPink=texHeart("#e8537a"), heartGray=texHeart("#9a9a9a");
    var aura=spr(texGlow(),5.4,0,0.1,-1.3,true);
    var heart=spr(heartPink,0.62,0,-0.5,1.12);
    var empty=spr(texEmpty(),1.15,0,2.0,0.4); empty.visible=false;
    var bags=spr(texBags(),1.05,0,0.2,1.2); bags.visible=false;
    var bubbles=spr(texBubbles(),0.85,0.55,0.7,1.1); bubbles.visible=false;

    var t0=Date.now(), raf=null, eyeOpen=1;
    var bounceT=0, ouchT=0, hopT=0, blinkUntil=0, nextBlink=Date.now()+1800;
    function animate(){
      raf=requestAnimationFrame(animate);
      var now=Date.now(), t=(now-t0)/1000;
      g.position.set(0, Math.sin(t*1.6)*0.05, 0); g.rotation.set(0, Math.sin(t*0.7)*0.18, 0); g.scale.set(1,1,1);
      body.scale.y = 1.25*(1+Math.sin(t*1.6)*0.012);
      if(bounceT>0){ var p=bounceT/0.6; g.position.y+=Math.sin((1-p)*Math.PI)*0.5; g.scale.set(1+0.06*p,1-0.05*p,1+0.06*p); bounceT-=0.016; if(bounceT<0)bounceT=0; }
      if(ouchT>0){ g.rotation.z=Math.sin(ouchT*42)*0.13*(ouchT/0.5); ouchT-=0.016; if(ouchT<0)ouchT=0; }
      if(hopT>0){ var hp=hopT/1.2; g.position.y+=Math.abs(Math.sin((1-hp)*Math.PI*2))*0.45; g.rotation.y+=(1-hp)*0.7; hopT-=0.016; if(hopT<0)hopT=0; }
      if(now>nextBlink && now>blinkUntil){ blinkUntil=now+130; nextBlink=now+2000+Math.random()*2600; }
      var ey=(now<blinkUntil)?0.08:eyeOpen; eyeL.scale.y=ey; eyeR.scale.y=ey;
      aura.material.rotation+=0.003;
      renderer.render(scene,camera);
    }
    function setState(st){
      var sx=st.ejercicio?0.9:1.32; body.scale.set(sx,1.25,sx);
      belly.scale.set(0.82*(st.ejercicio?0.95:1.22),1.0,0.45);
      aura.visible=!!st.oracion;
      heart.material.map=st.familia?heartPink:heartGray; heart.material.needsUpdate=true;
      empty.visible=!st.lectura;
      var mood=!st.respiracion?"gasp":(!st.meditacion?"angry":(!st.dormir?"tired":"happy"));
      mHappy.visible=tongue.visible=(mood==="happy"); mAngry.visible=(mood==="angry"); mTired.visible=(mood==="tired"); mGasp.visible=(mood==="gasp");
      browL.visible=browR.visible=(mood==="angry"); bags.visible=(mood==="tired"); bubbles.visible=(mood==="gasp");
      eyeOpen=(mood==="tired")?0.45:1;
      bodyMat.color.setHex(mood==="gasp"?0x8a5cc9:BODY);
      bellyMat.color.setHex(mood==="gasp"?0xb79be8:BELLY);
    }
    function resize(){ var w=container.clientWidth||W,h=container.clientHeight||H; camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
    animate();
    return { setState:setState, bounce:function(){bounceT=0.6;}, ouch:function(){ouchT=0.5;}, hop:function(){hopT=1.2;}, resize:resize,
      dispose:function(){ if(raf)cancelAnimationFrame(raf); try{renderer.dispose();}catch(e){} if(renderer.domElement&&renderer.domElement.parentNode)renderer.domElement.parentNode.removeChild(renderer.domElement); } };
  }

  /* ===================== BALANCE ===================== */
  function viewBalance(){
    var d=getDay(todayKey());
    var mente=sumMente(d), cuerpo=(d.deporte||0), familia=sumFamilia(d);

      kpi(mente+'<small> min</small>',"Mente & espíritu","var(--mente)")+
      kpi(cuerpo+'<small> min</small>',"Cuerpo (deporte)","var(--cuerpo)")+
      kpi(familia+'<small> min</small>',"Familia hoy","var(--familia)")+
      kpi((d.animo!=null?MOODS[d.animo-1].e:"—"),"Ánimo de hoy","var(--emo)")+'</div>';

    // Resumen semanal automático
    h+=weeklySummaryCard();

      '</div><div class="small-note" style="margin-top:14px">Cada número es cuántos de los últimos 7 días tocaste ese pilar. La meta no es maximizar uno, sino no dejar ninguno en cero.</div></div>';

  function kpi(v,k,c){ return '<div class="kpi"><div class="v" style="color:'+c+'">'+v+'</div><div class="k">'+k+'</div><span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:'+c+'"></span></div>'; }
  function streakBox(e,l,n){ return '<div class="streak"><div class="e">'+e+'</div><div class="n">'+n+'<small style="color:var(--muted);font-size:11px">/7</small></div><div class="l">'+l+'</div></div>'; }
  function sumMente(d){ return (d.lectura||0)+(d.meditacion||0)+(d.oracion||0)+(d.respiracion||0); }
  function sumFamilia(d){ var s=0; for(var k in d.familia) s+=d.familia[k]||0; return s; }

  function weekTotals(off0){
    var t={mente:0,cuerpo:0,familia:0,respira:0,moodSum:0,moodN:0,medT:0,medD:0,emo:{}};
    for(var i=0;i<7;i++){ var d=days[offsetKey(-(i+off0))]; if(!d)continue;
      t.mente+=(d.lectura||0)+(d.meditacion||0)+(d.oracion||0)+(d.respiracion||0);
      t.cuerpo+=(d.deporte||0); t.respira+=(d.respiracion||0);
      var fs=0; for(var k in (d.familia||{})) fs+=d.familia[k]||0; t.familia+=fs;
      if(d.animo!=null){ t.moodSum+=d.animo; t.moodN++; }
      for(var m=0;m<meds.length;m++){ t.medT++; if(d.meds&&d.meds[meds[m].id])t.medD++; }
      var em=d.emociones||[]; for(var e=0;e<em.length;e++) t.emo[em[e]]=(t.emo[em[e]]||0)+1;
    } return t;
  }
  function weeklySummaryCard(){
    var a=weekTotals(0), b=weekTotals(7);
    function delta(x,y){ if(y===0) return x>0?'<span class="d up">▲</span>':''; var p=Math.round((x-y)/y*100); if(p===0)return''; return '<span class="d '+(p>0?'up':'down')+'">'+(p>0?'▲':'▼')+Math.abs(p)+'%</span>'; }
    var mood=a.moodN?(a.moodSum/a.moodN):null;
    var adher=a.medT?Math.round(a.medD/a.medT*100):null;
    var topEmo="—",max=0; for(var e in a.emo){ if(a.emo[e]>max){max=a.emo[e];topEmo=e;} }
    var h='<div class="card"><div class="sec-label">Resumen de la semana</div><div class="week-grid">'+
      '<div class="wk"><div><span class="v">'+a.mente+'</span><small style="color:var(--muted)"> min</small>'+delta(a.mente,b.mente)+'</div><div class="k">Mente & espíritu</div></div>'+
      '<div class="wk"><div><span class="v">'+a.cuerpo+'</span><small style="color:var(--muted)"> min</small>'+delta(a.cuerpo,b.cuerpo)+'</div><div class="k">Cuerpo</div></div>'+
      '<div class="wk"><div><span class="v">'+a.familia+'</span><small style="color:var(--muted)"> min</small>'+delta(a.familia,b.familia)+'</div><div class="k">Familia</div></div>'+
      '<div class="wk"><div><span class="v">'+(mood!=null?mood.toFixed(1):"—")+'</span></div><div class="k">Ánimo promedio</div></div>'+
      '<div class="wk"><div><span class="v">'+(adher!=null?adher+"%":"—")+'</span></div><div class="k">Adherencia medic.</div></div>'+
      '<div class="wk"><div><span class="v" style="font-size:15px">'+topEmo+'</span></div><div class="k">Emoción más frecuente</div></div>'+
      '</div><div class="small-note" style="margin-top:12px">Comparado con la semana anterior. ▲ subió, ▼ bajó.</div></div>';
    return h;
  }

  function streaks7(){
    var o={mente:0,cuerpo:0,familia:0,respira:0,med:0};
    for(var i=0;i<7;i++){ var d=days[offsetKey(-i)]; if(!d)continue;
      if((d.lectura||0)+(d.meditacion||0)+(d.oracion||0)>0)o.mente++;
      if((d.deporte||0)>0)o.cuerpo++;
      var fs=0; for(var k in (d.familia||{}))fs+=d.familia[k]||0; if(fs>0)o.familia++;
      if((d.respiracion||0)>0)o.respira++;
      var any=false; for(var m in (d.meds||{})){ if(d.meds[m]){any=true;break;} } if(any)o.med++;
    } return o;
  }

  var curPeriod="semanal", curMetric="pilares";
  var PERIODS=[["diario","Diario"],["semanal","Semanal"],["quincenal","Quincenal"],["mensual","Mensual"],["trimestre","Trimestre"],["semestre","Semestre"],["anual","Anual"]];
  function metricsList(){ var m=[["pilares","Pilares (tiempo)"],["familia","Familia (detalle)"],["mente","Actividades mente"],["deporte","Deporte"],["sueno","Horas de sueño"],["animo","Ánimo promedio"],["peso","Peso"],["adher","Adherencia medicinas"]]; if(activities.length)m.push(["custom","Otros hábitos"]); return m; }
  function viewGraficas(){

    var ML=metricsList(),opt=""; for(var j=0;j<ML.length;j++) opt+='<option value="'+ML[j][0]+'"'+(curMetric===ML[j][0]?' selected':'')+'>'+ML[j][1]+'</option>';

  }
  function buckets(period){
    var out=[],i,j;
    if(period==="diario"){ for(i=13;i>=0;i--){ var k=offsetKey(-i); out.push({label:k.slice(8)+"/"+k.slice(5,7),keys:[k]}); } return out; }
    if(period==="semanal"){ for(i=11;i>=0;i--){ var ks=[]; for(j=0;j<7;j++)ks.push(offsetKey(-(i*7+j))); out.push({label:"S-"+i,keys:ks}); } return out; }
    if(period==="quincenal"){ for(i=7;i>=0;i--){ var k2=[]; for(j=0;j<15;j++)k2.push(offsetKey(-(i*15+j))); out.push({label:"Q-"+i,keys:k2}); } return out; }
    if(period==="mensual") return monthBuckets(12);
    if(period==="trimestre") return groupMonths(monthBuckets(24),3);
    if(period==="semestre") return groupMonths(monthBuckets(36),6);
    if(period==="anual") return yearBuckets();
    return out;
  }
  function monthBuckets(count){ var out=[],base=new Date(); base.setDate(1); var nm=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
    for(var i=count-1;i>=0;i--){ var d=new Date(base.getFullYear(),base.getMonth()-i,1); var y=d.getFullYear(),m=d.getMonth()+1,pre=y+"-"+(m<10?"0"+m:m); var keys=[]; for(var k in days){ if(k.indexOf(pre)===0)keys.push(k); } out.push({label:nm[m-1]+" "+String(y).slice(2),keys:keys}); } return out; }
  function groupMonths(mb,size){ var out=[]; for(var i=0;i<mb.length;i+=size){ var keys=[],lbl=""; for(var j=i;j<i+size&&j<mb.length;j++){ keys=keys.concat(mb[j].keys); if(j===i)lbl=mb[j].label; } out.push({label:lbl,keys:keys}); } return out; }
  function yearBuckets(){ var yrs={}; for(var k in days){ var y=k.slice(0,4); (yrs[y]=yrs[y]||[]).push(k); } var arr=Object.keys(yrs).sort(),out=[]; for(var i=0;i<arr.length;i++)out.push({label:arr[i],keys:yrs[arr[i]]}); if(!out.length)out.push({label:String(new Date().getFullYear()),keys:[]}); return out; }
  function sumKeys(keys,fn){ var s=0; for(var i=0;i<keys.length;i++){ var d=days[keys[i]]; if(d)s+=fn(d)||0; } return s; }
  function avgKeys(keys,fn){ var s=0,n=0; for(var i=0;i<keys.length;i++){ var d=days[keys[i]]; if(d){ var v=fn(d); if(v!=null){s+=v;n++;} } } return n?s/n:null; }

  function drawChart(){
    var el=document.getElementById("chart"); if(!el||!window.echarts)return;
    chart=window.echarts.init(el); var bs=buckets(curPeriod); var labels=bs.map(function(b){return b.label;});
    var axis={axisLine:{lineStyle:{color:"#D8CFBD"}},axisLabel:{color:"#8C8576",fontSize:10},splitLine:{lineStyle:{color:"#EFE8D8"}}};
    var grid={left:8,right:14,top:30,bottom:6,containLabel:true}; var opt,note="";
    function bar(name,color,fn){ return {name:name,type:"bar",stack:"x",itemStyle:{color:color,borderRadius:[3,3,0,0]},data:bs.map(function(b){return Math.round(sumKeys(b.keys,fn));})}; }
    function line(name,color,fn,avg){ return {name:name,type:"line",smooth:true,symbol:"circle",symbolSize:6,lineStyle:{width:3,color:color},itemStyle:{color:color},connectNulls:true,data:bs.map(function(b){ var v=avg?avgKeys(b.keys,fn):sumKeys(b.keys,fn); return v==null?null:Math.round(v*10)/10; })}; }

    if(curMetric==="pilares"){ opt=baseOpt(labels,grid,axis,true); opt.series=[bar("Mente","#6C7BD1",sumMente),bar("Cuerpo","#D9794E",function(d){return d.deporte||0;}),bar("Familia","#C4577A",sumFamilia)]; note="Minutos por pilar. Busca columnas parejas: ahí está el equilibrio."; }
    else if(curMetric==="familia"){ opt=baseOpt(labels,grid,axis,true); opt.series=[]; for(var i=0;i<members.length;i++){ (function(mb,idx){ opt.series.push(bar(mb.name,FAM_COLORS[idx%FAM_COLORS.length],function(d){return d.familia[mb.id]||0;})); })(members[i],i); } note="Tiempo con cada persona. ¿Alguien está quedando sin tiempo?"; }
    else if(curMetric==="mente"){ opt=baseOpt(labels,grid,axis,true); opt.series=[bar("Lectura","#6C7BD1",function(d){return d.lectura||0;}),bar("Meditación","#7E8FE0",function(d){return d.meditacion||0;}),bar("Oración","#9AA8EC",function(d){return d.oracion||0;}),bar("Respiración","#B7C2F4",function(d){return d.respiracion||0;})]; note="Detalle de tus prácticas de mente y espíritu."; }
    else if(curMetric==="deporte"){ opt=baseOpt(labels,grid,axis,false); opt.series=[bar("Deporte","#D9794E",function(d){return d.deporte||0;})]; note="Minutos de actividad física por periodo."; }
    else if(curMetric==="sueno"){ opt=baseOpt(labels,grid,axis,false); opt.yAxis.scale=true; opt.series=[line("Sueño","#7E8FE0",function(d){return d.sueno;},true)]; note="Horas de sueño promedio. Un descanso estable sostiene el ánimo, el peso y la energía."; }
    else if(curMetric==="animo"){ opt=baseOpt(labels,grid,axis,false); opt.yAxis.min=1; opt.yAxis.max=5; opt.series=[line("Ánimo","#E0A92E",function(d){return d.animo;},true)]; note="Promedio de ánimo (1 muy bajo · 5 muy bien). Mira si sube con más deporte o familia."; }
    else if(curMetric==="peso"){ opt=baseOpt(labels,grid,axis,false); opt.yAxis.scale=true; opt.series=[line("Peso","#5FA382",function(d){return d.peso;},true)]; note="Tendencia de peso. Fíjate en la pendiente de varias semanas, no en un día."; }
    else if(curMetric==="adher"){ opt=baseOpt(labels,grid,axis,false); opt.yAxis.min=0; opt.yAxis.max=100; opt.yAxis.axisLabel.formatter="{value}%"; opt.series=[line("Adherencia","#5FA382",function(d){ var t=meds.length; if(t===0)return null; var done=0; for(var i=0;i<meds.length;i++){ if(d.meds&&d.meds[meds[i].id])done++; } return done/t*100; },true)]; note="Porcentaje de medicinas tomadas."; }
    else if(curMetric==="custom"){ opt=baseOpt(labels,grid,axis,true); opt.series=[]; for(var c=0;c<activities.length;c++){ (function(ac,idx){ opt.series.push(bar(ac.name,["#6C7BD1","#5FA382","#E0A92E","#D9794E","#C4577A"][idx%5],function(d){return d.custom[ac.id]||0;})); })(activities[c],c); } note="Tus hábitos personalizados."; }

    chart.setOption(opt); var n=document.getElementById("chartNote"); if(n)n.textContent=note;
  }
  function baseOpt(labels,grid,axis,stack){ return {color:["#6C7BD1","#D9794E","#C4577A","#E0A92E","#5FA382"],tooltip:{trigger:"axis",backgroundColor:"#2C2A24",borderColor:"#2C2A24",textStyle:{color:"#fff",fontSize:12}},legend:{show:stack,top:0,textStyle:{color:"#8C8576",fontSize:11},itemWidth:12,itemHeight:8,icon:"roundRect"},grid:grid,xAxis:{type:"category",data:labels,axisLine:axis.axisLine,axisLabel:axis.axisLabel,axisTick:{show:false}},yAxis:{type:"value",axisLabel:{color:"#8C8576",fontSize:10},splitLine:axis.splitLine},series:[]}; }

    document.getElementById("bPhase").textContent=p.n;

  function breathTick(){
    if(!bState.running)return;
    bState.left--; bState.total++;
    document.getElementById("bCount").textContent=Math.max(0,bState.left);
    if(bState.left<=0){ bState.idx=(bState.idx+1)%bPhases.length; if(bState.idx===0)bState.cycle++; bState.left=bPhases[bState.idx].d; applyPhase(); }
  }

  /* ===================== ESPEJO IA ===================== */
  function buildSummary(){
    var rec=[]; for(var i=0;i<30;i++){ var k=offsetKey(-i); if(days[k])rec.push({k:k,d:days[k]}); }
    if(rec.length===0)return null;
    var t={mente:0,cuerpo:0,respira:0,familia:0,moodSum:0,moodN:0,low:0,medT:0,medD:0,emo:{},fam:{},notas:[],libros:{}};
    for(var j=0;j<rec.length;j++){ var d=rec[j].d;
      t.mente+=sumMente(d); t.cuerpo+=(d.deporte||0); t.respira+=(d.respiracion||0);
      for(var fk in (d.familia||{})){ t.familia+=d.familia[fk]||0; t.fam[fk]=(t.fam[fk]||0)+(d.familia[fk]||0); }
      if(d.animo!=null){ t.moodSum+=d.animo; t.moodN++; if(d.animo<=2)t.low++; }
      for(var m=0;m<meds.length;m++){ t.medT++; if(d.meds&&d.meds[meds[m].id])t.medD++; }
      var em=d.emociones||[]; for(var e=0;e<em.length;e++)t.emo[em[e]]=(t.emo[em[e]]||0)+1;
      if(d.nota)t.notas.push(rec[j].k+": "+d.nota);
      if(d.libro&&d.libro.titulo)t.libros[d.libro.titulo]=true;
    }
    var n=rec.length;
    var emoArr=Object.keys(t.emo).sort(function(a,b){return t.emo[b]-t.emo[a];}).slice(0,5).map(function(x){return x+"("+t.emo[x]+")";});
    var famArr=members.map(function(mb){ return mb.name+": "+Math.round((t.fam[mb.id]||0))+"min"; });
    var pesos=[]; for(var p=rec.length-1;p>=0;p--){ if(rec[p].d.peso!=null)pesos.push(rec[p].d.peso); }
    var pesoTxt = pesos.length>1 ? ("de "+pesos[0]+" a "+pesos[pesos.length-1]+" kg") : (pesos.length?pesos[0]+" kg":"sin datos");
    var s="DATOS DE BIENESTAR (últimos "+n+" días con registro):\n";
    s+="- Mente/espíritu: "+Math.round(t.mente/n)+" min/día promedio.\n";
    s+="- Cuerpo/deporte: "+Math.round(t.cuerpo/n)+" min/día promedio.\n";
    s+="- Respiración: "+Math.round(t.respira/n)+" min/día promedio.\n";
    s+="- Tiempo familia por persona (total): "+famArr.join(", ")+".\n";
    s+="- Ánimo promedio (1-5): "+(t.moodN?(t.moodSum/t.moodN).toFixed(1):"sin datos")+", con "+t.low+" día(s) de ánimo bajo (1-2).\n";
    s+="- Emociones más frecuentes: "+(emoArr.length?emoArr.join(", "):"sin datos")+".\n";
    s+="- Adherencia medicinas: "+(t.medT?Math.round(t.medD/t.medT*100)+"%":"sin medicinas registradas")+".\n";
    s+="- Peso: "+pesoTxt+".\n";
    s+="- Libros en lectura: "+(Object.keys(t.libros).join(", ")||"ninguno")+".\n";
    if(t.notas.length) s+="- Notas recientes del usuario:\n"+t.notas.slice(0,6).join("\n")+"\n";
    return s;
  }
  function runAI(){
    var out=document.getElementById("aiOut"); var btn=document.getElementById("aiBtn");
    var summary=buildSummary();
    if(!summary){ out.innerHTML='<div class="ai-out">Registra al menos unos días para que el Espejo tenga algo que reflejar. Vuelve después de un par de jornadas anotadas.</div>'; return; }
    btn.textContent="Pensando…"; btn.disabled=true;
    var system="Eres 'Espejo', un acompañante de bienestar cálido, sereno y honesto que habla en español con tuteo. Recibes datos de hábitos, ánimo, emociones, tiempo en familia y salud de una persona. NO eres psiquiatra ni médico: NUNCA diagnosticas, NUNCA usas etiquetas clínicas (depresión, ansiedad como trastorno, etc.) ni hablas como si tuvieras un título. Tu trabajo es devolverle a la persona, como un espejo amable, lo que se ve en sus datos: patrones, lo que está cuidando bien, lo que parece estar quedando corto, y observaciones suaves sobre su ánimo y emociones SIN dramatizar. Estructura tu respuesta en 4 partes breves con encabezados: 1) Lo que estás cuidando bien, 2) Lo que parece estar quedando corto, 3) Tu ánimo y emociones (observación, no juicio), 4) Tres pasos pequeños y concretos para esta semana. Sé específico usando los números que recibes. Tono humano, directo, esperanzador, sin frases de relleno. Máximo ~320 palabras. Si ves ánimo bajo sostenido o varias señales de malestar, incluye al final, con suavidad y sin alarmismo, una invitación a hablar con un profesional de salud mental o con alguien de confianza, dejando claro que pedir ayuda es señal de fortaleza. Termina recordando en una línea que esto es una reflexión, no un diagnóstico.";
    fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      model:"claude-sonnet-4-20250514",max_tokens:1000,system:system,

    })}).then(function(r){return r.json();}).then(function(data){

  function scheduleReminders(){
    for(var i=0;i<reminderTimers.length;i++)clearTimeout(reminderTimers[i]); reminderTimers=[];
    if(!("Notification" in window)||Notification.permission!=="granted")return;

    // Preferido: notificaciones programadas vía Service Worker (suenan aunque la app esté cerrada — Android/Chrome)
    if(navigator.serviceWorker && ('TimestampTrigger' in window)){
      navigator.serviceWorker.ready.then(function(reg){
        reg.getNotifications({includeTriggered:true}).then(function(list){
          for(var n=0;n<list.length;n++){ if(list[n].tag && list[n].tag.indexOf('eq-med-')===0) list[n].close(); }
          var now=Date.now();
          meds.forEach(function(m){ if(!m.hora)return; var p=m.hora.split(":");
            for(var day=0;day<7;day++){ var t=new Date(); t.setDate(t.getDate()+day); t.setHours(+p[0],+p[1],0,0);
              if(t.getTime()>now){ try{ reg.showNotification("💊 Hora de tu medicina",{body:m.nombre+(m.dosis?" · "+m.dosis:""),tag:"eq-med-"+m.id+"-"+day,icon:"icon-192.png",badge:"icon-192.png",showTrigger:new window.TimestampTrigger(t.getTime())}); }catch(e){} }
            } });
        }).catch(function(){});
      }).catch(function(){});
      return;
    }

    // Respaldo: setTimeout mientras la app está abierta (solo hoy)
    var now=new Date();
    meds.forEach(function(m){ if(!m.hora)return; var p=m.hora.split(":"); var t=new Date(); t.setHours(+p[0],+p[1],0,0); var diff=t-now;
      if(diff>0&&diff<24*3600*1000){ reminderTimers.push(setTimeout(function(){ try{ new Notification("💊 Hora de tu medicina",{body:m.nombre+(m.dosis?" · "+m.dosis:"")}); }catch(e){} },diff)); } });
  }

  function exportCSV(){
    var cols=["Fecha","Lectura","Meditacion","Oracion","Respiracion","Deporte","TipoDeporte","Libro","Peso","Animo","Emociones"];
    for(var i=0;i<members.length;i++)cols.push("Fam_"+members[i].name);
    cols.push("Adherencia%","Nota");
    var rows=[cols.join(";")];
    var keys=Object.keys(days).sort();
    for(var d=0;d<keys.length;d++){ var k=keys[d],x=days[k]; var medT=meds.length,medD=0; for(var m=0;m<meds.length;m++){ if(x.meds&&x.meds[meds[m].id])medD++; }
      var r=[k,x.lectura||0,x.meditacion||0,x.oracion||0,x.respiracion||0,x.deporte||0,csv(x.deporteTipo),csv(x.libro?x.libro.titulo:""),(x.peso!=null?String(x.peso).replace(".",","):""),(x.animo!=null?x.animo:""),csv((x.emociones||[]).join(" / "))];
      for(var f=0;f<members.length;f++)r.push((x.familia&&x.familia[members[f].id])||0);
      r.push(medT?Math.round(medD/medT*100):""); r.push(csv(x.nota||""));

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function exportJSON(){
    var backup={app:"equilibrio",version:3,exported:new Date().toISOString(),days:days,meds:meds,members:members,activities:activities,settings:settings,growth:growth};
    download("equilibrio_respaldo.json",JSON.stringify(backup),"application/json");
  }
  function importJSON(el){
    var file=el.files&&el.files[0]; if(!file)return;
    var rd=new FileReader();
    rd.onload=function(){ try{ var b=JSON.parse(rd.result);
      if(b.days){ days=b.days; persistDays(); }
      if(b.meds){ meds=b.meds; persist("eq:meds",meds); }
      if(b.members){ members=b.members; persist("eq:members",members); }
      if(b.activities){ activities=b.activities; persist("eq:activities",activities); }
      if(b.settings){ settings=b.settings; persist("eq:settings",settings); }
      if(b.growth){ growth=b.growth; persistGrowth(); }
      scheduleReminders(); render(); setTimeout(function(){ flash("#impSaved"); },100);
    }catch(e){ alert("No pude leer ese archivo de respaldo."); } };
    rd.readAsText(file);
  }
  window.addEventListener("resize",function(){ if(chart)chart.resize(); if(radar)radar.resize(); if(pet3d)pet3d.resize(); });
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){} }
  boot();
})();
</script>
</body>
</html>
